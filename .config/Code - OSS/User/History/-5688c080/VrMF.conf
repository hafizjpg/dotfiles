# ~/.config/hypr/hyprlock.conf — Void Purple
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.25
    color = rgba(0a0910ee)
}

input-field {
    monitor =
    size = 260, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(6E50EBee)
    inner_color = rgba(12101acc)
    font_color = rgba(F7EAF3ff)
    fade_on_empty = true
    placeholder_text = <span foreground="##8a839c">Masukkan password...</span>
    hide_input = false
    check_color = rgba(A08CF0ee)
    fail_color = rgba(ff5c7aee)
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(F7EAF3ff)
    font_size = 84
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(A08CF0ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}