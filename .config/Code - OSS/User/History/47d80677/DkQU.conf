general {
    lock_cmd = pidof hyprlock || hyprlock                                     # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                  # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

# 1. Animasi Kecerahan Layar & Backlight Keyboard (Dimming)
listener {
    timeout = 150                                # 2.5min.
    # Animasi smooth dimming kecerahan layar & keyboard
    on-timeout = brightnessctl -s set 10% && brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -r && brightnessctl -rd rgb:kbd_backlight
}

# 2. Custom Idle Animation (30 detik sebelum Lock Screen)
# Menurunkan kecerahan lebih dalam & memberikan indikasi visual layar akan terkunci
listener {
    timeout = 270                                # 4.5min (30 detik sebelum hyprlock)
    on-timeout = brightnessctl set 2%
    on-resume = brightnessctl -r
}

# 3. Lock Screen (5min)
listener {
    timeout = 300                                # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# 4. Screen Off / DPMS (5.5min)
listener {
    timeout = 330                                                                                  # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

# 5. Suspend PC (30min)
listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}

listener {
    timeout = 270
    on-timeout = ~/.config/hypr/scripts/idle_anim.sh
    on-resume = brightnessctl -r
}