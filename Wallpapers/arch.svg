<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#150a21" />
      <stop offset="60%" stop-color="#0b0612" />
      <stop offset="100%" stop-color="#030206" />
    </radialGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0a0FF" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#3c096c" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background 4K -->
  <rect width="3840" height="2160" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g opacity="0.05" stroke="#9d4edd" stroke-width="2">
    <path d="M 0,360 L 3840,360 M 0,720 L 3840,720 M 0,1080 L 3840,1080 M 0,1440 L 3840,1440 M 0,1800 L 3840,1800" />
    <path d="M 640,0 L 640,2160 M 1280,0 L 1280,2160 M 1920,0 L 1920,2160 M 2560,0 L 2560,2160 M 3200,0 L 3200,2160" />
  </g>

  <!-- Arch Logo Scaled for 4K -->
  <g transform="translate(1920, 1000) scale(2.6)" filter="url(#glow)">
    <path d="M 0,-160 
             C 12,-132 30,-98 55,-48 
             C 42,-34 30,-22 15,-10 
             C 32,-28 58,-52 85,-5 
             C 112,42 140,100 160,130 
             C 115,105 70,90 20,86 
             C -2,-18 -20,-50 -55,-100 
             C -35,-82 -15,-60 5,-40 
             C -35,-80 -95,20 -160,130 
             C -110,100 -55,88 0,86 
             C -12,50 -25,10 -55,-48 
             C -30,-98 -12,-132 0,-160 Z" 
          fill="url(#purpleGlow)" />
  </g>

  <text x="1920" y="1550" 
        text-anchor="middle" 
        fill="#F3F4F6" 
        font-family="JetBrains Mono, sans-serif" 
        font-size="60" 
        font-weight="bold" 
        letter-spacing="20" 
        opacity="0.85">ARCH LINUX</text>
</svg>
